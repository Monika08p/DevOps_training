<!DOCTYPE html>
<html>
<head>
<title>Student Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #0f2027, #2c5364);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 30px;
    color: #00c6ff;
}

table {
    margin: 30px auto;
    border-collapse: collapse;
    width: 80%;
}

th, td {
    padding: 12px;
    border: 1px solid #fff;
}

th {
    background: #007BFF;
}

tr {
    transition: 0.3s;
}

tr:hover {
    background: rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<h1>Student Dashboard</h1>

<table>
<thead>
<tr>
<th>Name</th>
<th>College</th>
<th>Email</th>
<th>Phone</th>
<th>Dept</th>
<th>Gender</th>
<th>Interest</th>
</tr>
</thead>

<tbody id="data"></tbody>
</table>

<script>
async function loadData() {
    let res = await fetch("/api/students");
    let data = await res.json();

    let rows = "";

    data.forEach(d => {
        rows += `
        <tr>
            <td>${d.name}</td>
            <td>${d.college}</td>
            <td>${d.email}</td>
            <td>${d.phone}</td>
            <td>${d.department}</td>
            <td>${d.gender}</td>
            <td>${d.interest}</td>
        </tr>`;
    });

    document.getElementById("data").innerHTML = rows;
}

loadData();
</script>

</body>
</html>
